name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches config.xml version
        run: |
          version=$(sed -n 's#.*<version>\(.*\)</version>.*#\1#p' ankio-tools/config.xml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match ankio-tools/config.xml version v$version" >&2
            exit 1
          fi

      - name: Package
        run: ./package.sh "$PWD/dist"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
